# 音乐陪伴库：供音乐选曲智能体（LLM）按场景描述匹配选曲
# file：相对 app/html/music/ 的路径，前端通过 /static/music/{file} 访问
# tags：情绪标签（LLM 不可用时回退到标签匹配用）
# desc：场景化描述（LLM 选曲的主要依据，写清声音特征/适用场景/与同类歌曲的区分）
music:
  # ------ calm：镇静安抚（焦虑 / 愤怒 / 失眠）------
  - file: "calm/calm_01_piano.mp3"
    name: "舒缓钢琴"
    tags: ["焦虑", "愤怒"]
    desc: |
      钢琴独奏，旋律舒缓，音符之间有明显的呼吸感，不急促。
      适合心里难受、想哭出来、需要情绪被"接住"的时刻。
      旋律本身能承载情绪，不像白噪音那样只是把感受盖住。
      如果用户想的是"我想哭一会儿"，它比雨声更合适（雨声太中性，不承载情绪）。
  - file: "calm/calm_02_rain.mp3"
    name: "雨声白噪音"
    tags: ["焦虑", "愤怒", "失眠"]
    desc: |
      持续的雨声，没有明显的旋律起伏，像窗外下了一整夜的雨。
      适合焦虑到脑子停不下来、需要被背景音填满安静的时刻——安静本身反而会放大烦躁。
      适合深夜睡不着，或者想盖过嘈杂环境、不去想具体事情的时候。
      如果用户的状态是"别让我思考"，它比钢琴更合适（钢琴有旋律，会主动牵引注意力）。
  - file: "calm/calm_03_ambient.mp3"
    name: "空灵氛围"
    tags: ["焦虑", "迷茫"]
    desc: |
      合成器铺底，几乎没有明确旋律，像漂浮在安静的太空里。
      适合想彻底放空、不想被任何具体情绪带着走的时候。
      它最"空"，不给情绪任何指向，适合需要短暂断联、什么都不想的时刻。
      如果用户只是想"静一静"而非表达情绪，它比钢琴/雨声都更合适。

  # ------ warm：温暖治愈（难过 / 委屈）------
  - file: "warm/warm_01_guitar.mp3"
    name: "温暖吉他"
    tags: ["难过", "委屈"]
    desc: |
      木吉他扫弦，音色温暖明亮，有家常感，不沉重。
      适合受了委屈、想被安慰、需要"有人在旁边"的感觉。
      像朋友坐在你旁边弹琴陪着你，而不是让你一个人待着。
      如果用户需要的是"被安慰"，它比大提琴更合适（大提琴太沉，适合独自消化）。
  - file: "warm/warm_02_cello.mp3"
    name: "大提琴慢板"
    tags: ["难过", "孤独"]
    desc: |
      大提琴独奏，音色低沉厚重，节奏很慢。
      适合难过到只想沉下来、不需要被打起精神的时候。
      它允许悲伤存在，不急着让你振作，适合"就是想难过一会儿"。
      如果用户不想被安慰、只想安静待着，它比吉他更合适（吉他太明亮温暖）。
  - file: "warm/warm_03_soft.mp3"
    name: "轻柔安慰"
    tags: ["委屈", "难过"]
    desc: |
      轻柔的琴声，音量很低，像有人在耳边轻声说话。
      适合心里憋着委屈、觉得不被理解、但说不清楚的时候。
      它不追问原因，只是轻轻陪着，像有人拍拍你的背。
      如果用户的感受是"憋屈"而非明确的难过，它比吉他/大提琴都更贴切。

  # ------ relax：放松解压（疲惫 / 迷茫）------
  - file: "relax/relax_01_meditation.mp3"
    name: "冥想放松"
    tags: ["疲惫", "焦虑"]
    desc: |
      缓慢的合成器铺底，节奏接近人的呼吸，很平稳。
      适合身体累到不想动、需要卸下一天负担的时候。
      适合闭眼躺着听，帮助身体从紧绷状态慢慢松下来。
      如果用户是"身体累"，它比森林鸟鸣更合适（鸟鸣更适合脑子乱）。
  - file: "relax/relax_02_nature.mp3"
    name: "森林鸟鸣"
    tags: ["疲惫", "迷茫"]
    desc: |
      真实的森林环境音，有鸟鸣、风声、树叶的沙沙声。
      适合脑子很乱、需要"换个环境透口气"的时候——哪怕只是在想象里。
      它把注意力从内部的思绪转移到外部世界，帮人跳出反复的念头。
      如果用户是"脑子乱"而非"身体累"，它比冥想音乐更合适。
  - file: "relax/relax_03_breath.mp3"
    name: "慢呼吸引导"
    tags: ["迷茫", "焦虑"]
    desc: |
      有明确而慢的节拍，像引导呼吸的节拍器，节奏稳定可跟随。
      适合迷茫、不知道该怎么办、需要一个锚点跟着走的时候。
      它给出节奏和方向感，帮人对抗"失控"和"不知道该做什么"。
      如果用户需要被"带着走"而非自己放空，它比森林鸟鸣更合适。

  # ------ companion：陪伴安全（孤独 / 害怕）------
  - file: "companion/companion_01_gentle.mp3"
    name: "温柔陪伴"
    tags: ["孤独", "难过"]
    desc: |
      温柔的琴声，旋律简单重复，像有人一直安静地在旁边。
      适合觉得只有自己一个人、需要陪伴感的时候。
      它营造"有人在"的氛围，直接对抗孤独感。
      如果用户是"孤独"，它比安心节拍更合适（节拍更针对害怕）。
  - file: "companion/companion_02_safe.mp3"
    name: "安心节拍"
    tags: ["害怕", "焦虑"]
    desc: |
      平稳规律的节奏，像心跳或缓慢的脚步声，非常稳定。
      适合害怕、不安、需要确认"我现在是安全的"的时候。
      稳定的重复节奏能给安全感，帮人对抗失控感和恐惧。
      如果用户是"害怕"，它比温柔陪伴更合适（陪伴针对孤独，节拍针对恐惧）。
